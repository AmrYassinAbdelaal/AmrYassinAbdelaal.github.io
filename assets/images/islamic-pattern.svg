<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Dense interlocking Islamic geometric tessellation — stone-carved style -->
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g fill="none" stroke="#c9a96e" stroke-linecap="round" stroke-linejoin="round">

    <!-- ===== 8-pointed star at center (two overlapping squares) ===== -->
    <!-- Square 1 (axis-aligned) -->
    <polygon points="100,30 170,100 100,170 30,100"
             stroke-width="1.2" opacity="0.40"/>
    <!-- Square 2 (rotated 45deg) -->
    <polygon points="100,20 180,80 140,170 20,130 60,30"
             stroke-width="0" opacity="0"/>
    <!-- Actual 8-pointed star outline -->
    <polygon points="100,20 120,50 150,30 148,68 180,68 160,96 190,110 158,118 170,150 138,138 130,170 100,148 70,170 62,138 30,150 42,118 10,110 40,96 20,68 52,68 50,30 80,50"
             stroke-width="1.4" opacity="0.50" filter="url(#glow)"/>

    <!-- Inner 8-pointed star -->
    <polygon points="100,42 114,60 134,48 130,72 156,74 140,92 162,102 140,110 148,134 126,126 120,148 100,132 80,148 74,126 52,134 60,110 38,102 60,92 44,74 70,72 66,48 86,60"
             stroke-width="1.0" opacity="0.42"/>

    <!-- Central octagon -->
    <polygon points="100,60 126,72 134,100 126,128 100,140 74,128 66,100 74,72"
             stroke-width="1.1" opacity="0.45"/>

    <!-- Inner octagon -->
    <polygon points="100,72 118,80 124,100 118,120 100,128 82,120 76,100 82,80"
             stroke-width="0.8" opacity="0.38"/>

    <!-- Center rosette — interlocking petals -->
    <polygon points="100,78 110,86 110,100 100,108 90,100 90,86"
             stroke-width="0.7" opacity="0.35"/>
    <polygon points="86,86 100,80 114,86 108,100 100,106 92,100"
             stroke-width="0.7" opacity="0.35"/>
    <circle cx="100" cy="94" r="8" stroke-width="0.7" opacity="0.35"/>
    <circle cx="100" cy="94" r="3" stroke-width="0.5" opacity="0.42"/>

    <!-- ===== Interlocking bands between star points ===== -->
    <!-- These create the dense "carved stone" feel -->
    <!-- Top -->
    <path d="M100,20 L108,0 M100,20 L92,0" stroke-width="0.9" opacity="0.32"/>
    <path d="M120,50 L138,28 L150,30" stroke-width="0.8" opacity="0.28"/>
    <path d="M80,50 L62,28 L50,30" stroke-width="0.8" opacity="0.28"/>
    <!-- Right -->
    <path d="M180,68 L200,60 M180,68 L200,76" stroke-width="0.9" opacity="0.32"/>
    <path d="M148,68 L160,50 M160,96 L178,88" stroke-width="0.7" opacity="0.25"/>
    <!-- Bottom -->
    <path d="M170,150 L188,168 M130,170 L138,190" stroke-width="0.8" opacity="0.28"/>
    <path d="M30,150 L12,168 M70,170 L62,190" stroke-width="0.8" opacity="0.28"/>
    <path d="M100,148 L100,180 M100,148 L108,176 M100,148 L92,176" stroke-width="0.7" opacity="0.25"/>
    <!-- Left -->
    <path d="M20,68 L0,60 M20,68 L0,76" stroke-width="0.9" opacity="0.32"/>
    <path d="M52,68 L40,50 M40,96 L22,88" stroke-width="0.7" opacity="0.25"/>

    <!-- ===== Corner kite shapes (complete when tiled) ===== -->
    <path d="M0,0 L50,30 L52,68 L20,68 Z" stroke-width="0.8" opacity="0.25"/>
    <path d="M200,0 L150,30 L148,68 L180,68 Z" stroke-width="0.8" opacity="0.25"/>
    <path d="M0,200 L30,150 L52,168 L20,168 Z" stroke-width="0.7" opacity="0.20"/>
    <path d="M200,200 L170,150 L158,118 L190,110 Z" stroke-width="0.7" opacity="0.20"/>

    <!-- Cross bands connecting kites -->
    <line x1="50" y1="30" x2="80" y2="50" stroke-width="0.6" opacity="0.22"/>
    <line x1="150" y1="30" x2="120" y2="50" stroke-width="0.6" opacity="0.22"/>
    <line x1="180" y1="68" x2="156" y2="74" stroke-width="0.6" opacity="0.22"/>
    <line x1="20" y1="68" x2="44" y2="74" stroke-width="0.6" opacity="0.22"/>

    <!-- Horizontal & vertical interlocking bands -->
    <line x1="0" y1="100" x2="38" y2="102" stroke-width="0.7" opacity="0.28"/>
    <line x1="162" y1="102" x2="200" y2="100" stroke-width="0.7" opacity="0.28"/>
    <line x1="100" y1="0" x2="100" y2="20" stroke-width="0.7" opacity="0.28"/>
    <line x1="100" y1="170" x2="100" y2="200" stroke-width="0.7" opacity="0.28"/>

    <!-- Small pentagon/hexagon fills in interstices -->
    <polygon points="52,68 44,74 40,96 60,92 66,72" stroke-width="0.6" opacity="0.22"/>
    <polygon points="148,68 156,74 160,96 140,92 134,72" stroke-width="0.6" opacity="0.22"/>
    <polygon points="60,110 42,118 52,134 74,128 66,100" stroke-width="0.6" opacity="0.22"/>
    <polygon points="140,110 158,118 148,134 126,128 134,100" stroke-width="0.6" opacity="0.22"/>
  </g>

  <!-- Warm golden node dots (neural network overlay) -->
  <g fill="#d4b896">
    <!-- Outer star tips -->
    <circle cx="100" cy="20" r="2.5" opacity="0.60"/>
    <circle cx="150" cy="30" r="2" opacity="0.50"/>
    <circle cx="180" cy="68" r="2.5" opacity="0.60"/>
    <circle cx="190" cy="110" r="2" opacity="0.50"/>
    <circle cx="170" cy="150" r="2.5" opacity="0.60"/>
    <circle cx="130" cy="170" r="2" opacity="0.50"/>
    <circle cx="100" cy="148" r="2.5" opacity="0.60"/>
    <circle cx="70" cy="170" r="2" opacity="0.50"/>
    <circle cx="30" cy="150" r="2.5" opacity="0.60"/>
    <circle cx="10" cy="110" r="2" opacity="0.50"/>
    <circle cx="20" cy="68" r="2.5" opacity="0.60"/>
    <circle cx="50" cy="30" r="2" opacity="0.50"/>
    <!-- Inner star vertices -->
    <circle cx="120" cy="50" r="1.8" opacity="0.45"/>
    <circle cx="148" cy="68" r="1.5" opacity="0.40"/>
    <circle cx="160" cy="96" r="1.8" opacity="0.45"/>
    <circle cx="158" cy="118" r="1.5" opacity="0.40"/>
    <circle cx="138" cy="138" r="1.8" opacity="0.45"/>
    <circle cx="100" cy="148" r="1.5" opacity="0.40"/>
    <circle cx="62" cy="138" r="1.8" opacity="0.45"/>
    <circle cx="42" cy="118" r="1.5" opacity="0.40"/>
    <circle cx="40" cy="96" r="1.8" opacity="0.45"/>
    <circle cx="52" cy="68" r="1.5" opacity="0.40"/>
    <circle cx="80" cy="50" r="1.8" opacity="0.45"/>
    <!-- Octagon vertices -->
    <circle cx="126" cy="72" r="1.5" opacity="0.38"/>
    <circle cx="134" cy="100" r="1.5" opacity="0.38"/>
    <circle cx="126" cy="128" r="1.5" opacity="0.38"/>
    <circle cx="74" cy="128" r="1.5" opacity="0.38"/>
    <circle cx="66" cy="100" r="1.5" opacity="0.38"/>
    <circle cx="74" cy="72" r="1.5" opacity="0.38"/>
    <!-- Center -->
    <circle cx="100" cy="94" r="3" opacity="0.70"/>
    <!-- Corners -->
    <circle cx="0" cy="0" r="2" opacity="0.35"/>
    <circle cx="200" cy="0" r="2" opacity="0.35"/>
    <circle cx="0" cy="200" r="2" opacity="0.35"/>
    <circle cx="200" cy="200" r="2" opacity="0.35"/>
  </g>
</svg>
